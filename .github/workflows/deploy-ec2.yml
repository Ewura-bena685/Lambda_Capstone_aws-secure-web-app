name: Deploy Hostel App to EC2

on:
  push:
    branches: [main]
    paths: ["src/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  INSTANCE_ID: i-0b77c1ddb80671119
  ROLE_ARN: arn:aws:iam::842053011488:role/GitHub-Actions-Role

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deploy script on EC2
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["runuser -l ec2-user -c /home/ec2-user/deploy.sh"]' \
            --query "Command.CommandId" --output text)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            echo "Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            case "$STATUS" in Failed|Cancelled|TimedOut)
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                --query StandardErrorContent --output text
              exit 1;;
            esac
            sleep 10
          done
