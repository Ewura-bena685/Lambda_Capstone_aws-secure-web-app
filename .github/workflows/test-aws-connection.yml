name: Test AWS Connection

# Run manually from the Actions tab (no push or PR trigger)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-aws:
    name: Verify AWS OIDC access
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC
      contents: read
    steps:
      # Debug 1: what GitHub tells AWS about this run (the token itself is NOT printed)
      - name: Show OIDC claims
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("sub", "aud", "repository", "ref"):
              print(key + ": " + str(claims.get(key)))
          PY

      # Debug 2: what is saved in the GitHub variables (brackets reveal stray spaces)
      - name: Show saved variables
        run: |
          echo "AWS_ROLE_ARN=[${{ vars.AWS_ROLE_ARN }}]"
          echo "AWS_REGION=[${{ vars.AWS_REGION }}]"

      # Role ARN typed directly (not from the variable), so we can tell
      # whether the variable or the AWS trust policy is the problem
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::842053011488:role/GitHub-Actions-Role
          aws-region: us-east-1

      - name: Who am I?
        run: aws sts get-caller-identity
